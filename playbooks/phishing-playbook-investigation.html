// 2. State Engine Tracking Variables
let currentPlaybookKey = "phishing_investigation";
let currentStepId = "step1";

/**
 * State Transition Engine
 */
function renderCurrentStep() {
    const viewport = document.getElementById("playbook-viewport");
    const playbook = playbooksData[currentPlaybookKey];
    const node = playbook.steps[currentStepId];

    if (!viewport || !node) return;

    // Update Progress Indicator Layout
    const progressVal = node.progress || 100;
    const progressFill = document.getElementById("progressFill");
    if (progressFill) {
        progressFill.style.height = progressVal + "%";
    }

    // Handle Ultimate Resolution/Result Output Cards
    if (node.isResult) {
        viewport.innerHTML = `
            <section class="content-box result-card">
                <h2>${node.title}</h2>
                <p style="margin-top: 15px; font-size: 1.1rem; line-height: 1.6;">${node.description}</p>
                <div class="decision-buttons" style="justify-content: center;">
                    <button class="decision-btn" onclick="restartPlaybookEngine()">Restart Playbook</button>
                </div>
            </section>
        `;
        // The scroll command has been removed here
        return;
    }

    // Build Step Meta Elements Layout (Tools & Links)
    let resourcesHTML = "";
    if (node.resources && node.resources.length > 0) {
        resourcesHTML = `<div class="resource-grid" style="justify-content: center;">`;
        node.resources.forEach(res => {
            resourcesHTML += `<a target="_blank" href="${res.url}">${res.name}</a>`;
        });
        resourcesHTML += `</div>`;
    }

    // Build Choice Control Interfaces
    let buttonsHTML = `<div class="decision-buttons" style="justify-content: center;">`;
    if (node.choices) {
        node.choices.forEach(choice => {
            buttonsHTML += `<button class="decision-btn" onclick="executeTransition('${choice.next}')">${choice.text}</button>`;
        });
    }
    buttonsHTML += `</div>`;

    // Inject Constructed Interface Output Elements
    viewport.innerHTML = `
        <section class="content-box playbook-step">
            <h2>${node.title}</h2>
            <p style="line-height: 1.6;">${node.description}</p>
            ${resourcesHTML}
            ${buttonsHTML}
        </section>
    `;

    // The scroll command has been removed here as well
}

/**
 * Engine Navigation and Triggers
 */
function executeTransition(nextStepId) {
    currentStepId = nextStepId;
    renderCurrentStep();
}

function restartPlaybookEngine() {
    currentStepId = "step1";
    renderCurrentStep();
}

// Kickstart on Page Load Initialization
document.addEventListener("DOMContentLoaded", () => {
    renderCurrentStep();
});

</script>
